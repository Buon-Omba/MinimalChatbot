<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel=stylesheet href="styles.css">
    <script src="script.js"></script>

    <!-- Includi Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <link href="favicon.png" rel="icon" sizes="32x32">
    <title>Chatbot</title>
</head>
<body>
    <div class="container mt-0">
        <div class="row">
            <div class="col-md-12">
                <h1>Chatbot</h1>
                <h5>Crea testo, audio o immagini con le API <a href="https://pollinations.ai/">Pollinations</a></h5>
                <div id="result" class="result">Qui compariranno le risposte</div>

                <form class="form">
                    <input type="text" class="input-field" id="testo" required>
                    <br>
                    <label><input type="radio" value="text" name="tipologia">&#128394;</input></label>
                    <label><input type="radio" value="audio" name="tipologia">&#127911;</input></label>
                    <label><input type="radio" value="image" name="tipologia" checked>&#127912;</input></label>
                    <label><input type="checkbox" id="NSFW" value="yes">NSFW</input></label>
                    <button type="submit" class="btn" onClick=scelta()>Invia</button>
                    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
